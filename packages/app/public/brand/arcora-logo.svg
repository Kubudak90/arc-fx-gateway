<svg width="1200" height="380" viewBox="0 0 1200 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Arcora Logo</title>
  <desc id="desc">Arcora fintech logo with blue and teal abstract arc A symbol and dark navy wordmark.</desc>
  <defs>
    <linearGradient id="arcoraBlue" x1="72" y1="56" x2="242" y2="242" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563FF"/>
      <stop offset="1" stop-color="#165DFF"/>
    </linearGradient>
    <linearGradient id="arcoraTeal" x1="124" y1="244" x2="280" y2="94" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00C2A8"/>
      <stop offset="1" stop-color="#21D4E6"/>
    </linearGradient>
    <linearGradient id="arcoraBlend" x1="85" y1="262" x2="288" y2="161" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#2563FF"/>
      <stop offset="0.55" stop-color="#1B9BDE"/>
      <stop offset="1" stop-color="#00C2A8"/>
    </linearGradient>
    <filter id="softShadow" x="-40" y="-20" width="380" height="380" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="14" stdDeviation="18" flood-color="#0B1426" flood-opacity="0.12"/>
    </filter>
  </defs>

  <!-- Icon -->
  <g transform="translate(56 32)" filter="url(#softShadow)">
    <!-- Left rising A stroke -->
    <path d="M154 28C148 18 134 18 128 28L36 212C30 224 39 238 52 238H100C107 238 113 234 116 228L154 148L192 228C195 234 201 238 208 238H258C271 238 280 224 274 212L154 28Z" fill="url(#arcoraBlue)"/>

    <!-- Inner negative-space cut for A (counter shifted -18) -->
    <path d="M154 78L126 138C122 146 128 155 137 155H181C190 155 196 146 192 138L164 78C162 73 156 73 154 78Z" fill="white" fill-opacity="0.98"/>

    <!-- Flow / settlement arc -->
    <path d="M72 238C104 191 145 166 196 166C228 166 253 174 278 190C287 196 289 209 282 217L257 247C251 254 240 256 232 251C218 243 201 238 181 238C142 238 108 256 82 292C76 300 64 302 56 296L21 270C12 263 11 250 18 241C33 221 49 203 67 188C77 180 91 187 91 200V219C91 226 87 233 82 238H72Z" fill="url(#arcoraTeal)"/>

    <!-- White separation highlight -->
    <path d="M86 220C122 184 163 167 210 170C233 172 252 178 271 190" stroke="white" stroke-width="13" stroke-linecap="round" opacity="0.92"/>

    <!-- Small terminal node suggesting payment route -->
    <circle cx="273" cy="194" r="15" fill="url(#arcoraBlend)"/>
    <circle cx="273" cy="194" r="6" fill="white" fill-opacity="0.92"/>
  </g>

  <!-- Wordmark -->
  <g transform="translate(372 110)">
    <text x="0" y="86" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="104" font-weight="750" letter-spacing="-4" fill="#0B1426">Arcora</text>
    <text x="6" y="136" font-family="Inter, ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif" font-size="24" font-weight="650" letter-spacing="5" fill="#64748B">STABLECOIN CHECKOUT &amp; SETTLEMENT</text>
  </g>
</svg>
