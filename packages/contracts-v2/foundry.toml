[profile.default]
src = "src"
out = "out"
libs = ["lib"]
test = "test"
script = "script"
solc = "0.8.24"
optimizer = true
optimizer_runs = 200
# Hooks pass calldata between contracts; via-ir keeps stack depth manageable and
# matches how these will be deployed.
via_ir = false
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./" }]

# Named forks for acceptance tests. Populated from the environment so no RPC URL
# or key is ever committed. Tests that fork read these via vm.envOr(...).
[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC_URL}"
base_sepolia = "${BASE_SEPOLIA_RPC_URL}"
arbitrum_sepolia = "${ARBITRUM_SEPOLIA_RPC_URL}"
optimism_sepolia = "${OP_SEPOLIA_RPC_URL}"
ethereum_sepolia = "${ETHEREUM_SEPOLIA_RPC_URL}"
avalanche_fuji = "${AVALANCHE_FUJI_RPC_URL}"

[etherscan]
base_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 84532 }
arbitrum_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 421614 }
optimism_sepolia = { key = "${ETHERSCAN_API_KEY}", chain = 11155420 }

[fmt]
line_length = 100
tab_width = 4
bracket_spacing = true
