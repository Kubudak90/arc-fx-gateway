[profile.default]
src = "src"
out = "out"
libs = ["lib"]
solc = "0.8.26"
optimizer = true
optimizer_runs = 200
evm_version = "cancun"
fs_permissions = [{ access = "read", path = "./"}]
gas_reports = ["ArcFXGatewayV10"]
ffi = true
no_match_path = 'test/legacy/**/*.t.sol'

[profile.ci]
fuzz = { runs = 10000 }
invariant = { runs = 256, depth = 64 }

[profile.legacy]
match_path = 'test/legacy/**/*.t.sol'
no_match_path = '__never_matches__'

[rpc_endpoints]
arc_testnet = "${ARC_TESTNET_RPC}"

[etherscan]
arc_testnet = { key = "${ARC_EXPLORER_KEY}", url = "${ARC_EXPLORER_URL}" }
