<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Acme Coffee · Pay with stablecoin</title>
    <style>
      :root {
        --cb-blue: #0052ff;
        --cb-hover: #578bfa;
        --cb-black: #0a0b0d;
        --cb-gray: #5b616e;
        --cb-cool: #eef0f3;
      }
      *, *::before, *::after { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Inter", sans-serif;
        background: #fff;
        color: var(--cb-black);
        -webkit-font-smoothing: antialiased;
      }
      main { display: grid; place-items: center; min-height: 100vh; padding: 24px; }
      .card {
        max-width: 420px;
        width: 100%;
        text-align: center;
        padding: 40px 32px;
        border: 1px solid rgba(91, 97, 110, 0.12);
        border-radius: 24px;
        background: #fff;
      }
      .brand {
        font-size: 14px;
        font-weight: 600;
        color: var(--cb-gray);
        text-transform: uppercase;
        letter-spacing: 1px;
        margin-bottom: 24px;
      }
      h1 { font-size: 28px; margin: 0 0 12px; line-height: 1.2; }
      p { color: var(--cb-gray); margin: 0 0 32px; font-size: 16px; }
      .pay-btn {
        padding: 16px 36px;
        border-radius: 56px;
        background: var(--cb-black);
        color: #fff;
        font-weight: 600;
        border: none;
        cursor: pointer;
        font-size: 16px;
        letter-spacing: 0.16px;
        transition: background 150ms ease;
      }
      .pay-btn:hover:not(:disabled) { background: var(--cb-hover); }
      .pay-btn:disabled { opacity: 0.5; cursor: not-allowed; }
      .status {
        margin-top: 28px;
        padding: 14px 18px;
        border-radius: 12px;
        font-size: 14px;
        text-align: left;
      }
      .status.success { background: #ecfdf5; color: #047857; }
      .status.warn    { background: #fef3c7; color: #92400e; }
      .status.error   { background: #fee2e2; color: #991b1b; }
      .status.error code { display: block; margin-top: 6px; font-size: 12px; word-break: break-all; }
      .footer {
        margin-top: 40px;
        font-size: 13px;
      }
      .footer a {
        color: var(--cb-blue);
        text-decoration: none;
      }
      .footer a:hover { text-decoration: underline; }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
